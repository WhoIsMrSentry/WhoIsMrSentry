name: Daily Profile Automation

on:
  workflow_dispatch:
    inputs:
      total_repos:
        description: "Value for TOTAL_REPOS"
        required: false
        default: "76"
      run_tech_usage:
        description: "Run repo-based tech usage scan (slow)"
        required: false
        default: false
        type: boolean
      run_github_stats_generator:
        description: "Run terminal-style github stats generator"
        required: false
        default: false
        type: boolean
      run_snake:
        description: "Run snake generation"
        required: false
        default: true
        type: boolean
  schedule:
    # 01:00 Turkey time (UTC+3) == 22:00 UTC
    - cron: "0 22 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"
  repository_dispatch:
    types:
      - profile-update

permissions:
  contents: write

concurrency:
  group: daily-profile-automation
  cancel-in-progress: false

jobs:
  update_profile_assets:
    name: Update Profile Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Checkout and run github_stats generator (Optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_github_stats_generator }}
        env:
          GHT: ${{ secrets.GHT }}
          GITHUB_TOKEN: ${{ secrets.GHT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          TOTAL_REPOS: ${{ inputs.total_repos || '76' }}
        run: |
          git clone --depth 1 https://github.com/yogeshwaran01/github-stats-terminal-style.git _generator
          cd _generator
          npm ci
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function findThemesFile(startDir) {
            const stack = [startDir];
            const candidates = new Set(['themes.constants.ts', 'themes.json', 'themes.ts', 'themes.js', 'themes.config.ts', 'themes.config.js']);
            while (stack.length) {
              const dir = stack.pop();
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isFile() && candidates.has(entry.name)) return fullPath;
                if (entry.isDirectory() && !entry.name.startsWith('.')) stack.push(fullPath);
              }
            }
            return null;
          }
          const themesPath = findThemesFile('src/constants') || findThemesFile('src') || findThemesFile('.');
          if (themesPath && fs.existsSync(themesPath)) {
            let text = fs.readFileSync(themesPath, 'utf8');
            const blockRegex = /(powershell\s*:\s*\{[\s\S]*?\})/;
            const match = text.match(blockRegex);
            if (match) {
              let block = match[1]
                .replace(/(background\s*:\s*['"])([^'"]*)(['"])/, '$1#200009$3')
                .replace(/(foreground\s*:\s*['"])([^'"]*)(['"])/, '$1#e6e6e6$3')
                .replace(/(cursor\s*:\s*['"])([^'"]*)(['"])/, '$1#88001b$3');
              text = text.replace(blockRegex, block);
              fs.writeFileSync(themesPath, text);
            }
          }
          NODE
          if [ ! -f "dist/bin/github-stats-terminal.js" ]; then
            npm run build
          fi
          node dist/bin/github-stats-terminal.js "${{ github.repository_owner }}" powershell
          cd ..
          cp _generator/github_stats.svg ./github_stats.svg
          python scripts/update_github_stats_svg.py

      - name: Refresh animated terminal panel stats
        env:
          GITHUB_TOKEN: ${{ secrets.GHT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          TOTAL_REPOS: ${{ (github.event_name == 'workflow_dispatch' && inputs.total_repos) || '76' }}
        run: python scripts/update_profile_terminal_panel_svg.py

      - name: Refresh contribution streak svg
        run: python scripts/update_streak_stats_svg.py

      - name: Refresh profile views endpoint
        run: python scripts/update_profile_views_json.py

      - name: Refresh SentryBOT views badge
        env:
          SENTRYBOT_TOKEN: ${{ secrets.SENTRYBOT_TOKEN }}
          GHT: ${{ secrets.GHT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_sentrybot_views.py

      - name: Refresh achievement metrics endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GHT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          PROFILE_REPO_OWNER: ${{ github.repository_owner }}
          PROFILE_REPO_NAME: ${{ github.event.repository.name }}
        run: python scripts/update_achievement_metrics_json.py

      - name: Generate native activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GHT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_activity_graph_svg.py

      - name: Refresh tech usage svg (Optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tech_usage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_tech_usage_svg.py

      - name: Commit and push profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/
          if [ -f "github_stats.svg" ]; then
            git add github_stats.svg
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile assets"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $i), retrying..."
            sleep 3
          done
          echo "Failed to push after retries."
          exit 1

  snake:
    name: Generate commit snake
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_snake }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: WhoIsMrSentry
          outputs: |
            dist/snake_dark.svg?palette=github-dark&color_snake=%23ff1744&color_dots=%23ff1744,%2339ff14,%2339ff14,%2339ff14,%2339ff14

      - name: Generate snake (light)
        uses: Platane/snk@v3
        with:
          github_user_name: WhoIsMrSentry
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%23ff1744&color_dots=%23ff1744,%2339ff14,%2339ff14,%2339ff14,%2339ff14

      - name: Patch snake SVGs (background + neon glow)
        run: |
          python - <<'PY'
          from pathlib import Path

          source_files = [Path('dist/snake_dark.svg'), Path('dist/snake.svg')]
          out_dir = Path('dist_patched')
          out_dir.mkdir(parents=True, exist_ok=True)

          bg = '#200009'
          neon = '#39ff14'
          neon_red = '#ff1744'
          snake = '#ff1744'
          glow_id = 'sentry-neon-style'

          for source_file in source_files:
              if not source_file.exists():
                  print(f'Skip (missing): {source_file}')
                  continue

              text = source_file.read_text(encoding='utf-8')

              close = text.find('>')
              if close == -1:
                  raise RuntimeError(f'Invalid SVG: {source_file}')

              inserts = []
              if f'<rect width="100%" height="100%" fill="{bg}"' not in text:
                  inserts.append(f'  <rect width="100%" height="100%" fill="{bg}" />')

              if glow_id not in text:
                  inserts.append(
                      '  <style id="' + glow_id + '"><![CDATA['
                      + f'rect[fill="{neon}"], path[fill="{neon}"]' + '{'
                      + 'filter: drop-shadow(0 0 1px #39ff14) drop-shadow(0 0 5px #39ff14);'
                      + '}'
                    + f'rect[fill="{neon_red}"], path[fill="{neon_red}"]' + '{'
                    + 'filter: drop-shadow(0 0 1px #ff1744) drop-shadow(0 0 4px #ff1744);'
                    + '}'
                      + f'rect[fill="{snake}"], path[fill="{snake}"]' + '{'
                      + 'filter: drop-shadow(0 0 1px #ff1744) drop-shadow(0 0 4px #ff1744);'
                      + '}'
                      + ']]></style>'
                  )

              if inserts:
                  text = text[:close + 1] + '\n' + '\n'.join(inserts) + text[close + 1:]

              out_file = out_dir / source_file.name
              out_file.write_text(text, encoding='utf-8')
              print(f'Patched SVG: {out_file}')
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist_patched
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
